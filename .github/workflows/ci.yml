name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # SHA-pinned: this CI is presented as a security control, so its own
      # actions are pinned to immutable commits, not mutable tags (OWASP A06).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pytest-xdist ruff

      - name: Lint with ruff
        run: ruff check lastrites tests

      - name: Format check with ruff
        run: ruff format --check lastrites tests

      - name: Run pytest (sharded)
        run: pytest -n auto --dist=worksteal

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      # The official gitleaks action (a Go binary), SHA-pinned. gitleaks is
      # NOT distributed on PyPI; `pip install gitleaks` would pull an
      # unaffiliated squatter — so it never appears in a pip line here.
      # No continue-on-error: a secret finding fails the build, by design.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
