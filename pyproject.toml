[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastrites"
version = "0.1.0"
description = "Local-first credential-estate watchdog: detection and escalation."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
lastrites = "lastrites.cli:main"

[tool.setuptools.packages.find]
include = ["lastrites*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
